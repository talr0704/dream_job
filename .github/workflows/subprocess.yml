name: Deployment subprocess portability
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  subprocess:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- tests/cloudflare/subprocess.test.ts tests/cloudflare/deployment.test.ts
        env:
          WRANGLER_SEND_METRICS: 'false'
