name: Validate frontend and Worker
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_frontend:
        description: Publish frontend to GitHub Pages after validation (does not deploy Worker)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install-deps chromium
      - run: npm test && npm run test:legacy && npm run test:integration && npm run test:ui
      - run: node scripts/evaluate-tailoring.mjs
      - run: npm run worker:check
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run build:same-origin && npm run worker:check:same-origin && node scripts/check-same-origin.mjs
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-artifacts
          path: |
            artifacts/
            test-results/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_frontend
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
